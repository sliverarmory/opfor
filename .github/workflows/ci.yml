name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -timeout=300s

  race:
    name: Race test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Race test
        run: go test -race ./... -count=1 -timeout=420s

  pure-go:
    name: Pure Go test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Pure Go test
        run: go test ./... -count=1 -timeout=300s

  benchmark-smoke:
    name: Sleep benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Execute every Sleep benchmark workload once
        run: go test ./internal/opfor -run='^$' -bench='^BenchmarkSleep' -benchtime=1x -count=1 -timeout=600s

  fuzz:
    name: Budgeted fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz lexer
        run: go test ./internal/lexer -run='^$' -fuzz='^FuzzLex$' -fuzztime=5s -timeout=2m
      - name: Fuzz parser
        run: go test ./internal/parser -run='^$' -fuzz='^FuzzParse$' -fuzztime=5s -timeout=2m
      - name: Fuzz compiler
        run: go test ./internal/compiler -run='^$' -fuzz='^FuzzCompilePipeline$' -fuzztime=5s -timeout=2m
      - name: Fuzz public compile pipeline
        run: go test ./internal/opfor -run='^$' -fuzz='^FuzzCompile$' -fuzztime=5s -timeout=2m
      - name: Fuzz regex
        run: go test ./internal/regexp2 -run='^$' -fuzz='^FuzzCompileAndMatchContext$' -fuzztime=5s -timeout=2m
      - name: Fuzz runtime lifecycle
        run: go test ./internal/opfor -run='^$' -fuzz='^FuzzRuntimeLifecycle$' -fuzztime=5s -timeout=2m

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build CLI
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o opfor-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/opfor

  official-sleep-differential:
    name: Official Sleep 2.1 differential
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-alpha.'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
      OPFOR_REQUIRE_SLEEP_JAR: "1"
      OPFOR_SLEEP_JAR: /tmp/opfor-official-sleep-2.1.jar
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up pinned Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: 21.0.8+9
      - name: Download authenticated official Sleep 2.1 JAR
        shell: bash
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://sleep.dashnine.org/download/sleep.jar \
            --output "${OPFOR_SLEEP_JAR}"
          echo "0ddde5e9e8d8d8d334d071b1f887c379f5d0be9b190566f05365997b3e375ff1  ${OPFOR_SLEEP_JAR}" | sha256sum --check --strict
      - name: Run every official Sleep differential in strict mode
        run: make test-sleep-java

  release-package:
    name: Package alpha release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-alpha.')
    needs: [test, race, pure-go, benchmark-smoke, fuzz, cross-build, official-sleep-differential]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require strict alpha tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.(0|[1-9][0-9]*)(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "not a strict OPFOR alpha tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - name: Require tag to match source version
        shell: bash
        run: test "$(go run ./cmd/opfor version)" = "opfor ${GITHUB_REF_NAME}"
      - name: Verify modules before packaging
        run: go mod verify
      - name: Build deterministic release archives
        shell: bash
        run: go run ./internal/cmd/releasepack -version "${GITHUB_REF_NAME}" -out dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opfor-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release-smoke:
    name: Smoke package (${{ matrix.platform }}/${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-alpha.')
    needs: release-package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: amd64
          - runner: macos-latest
            platform: darwin
            arch: arm64
          - runner: windows-latest
            platform: windows
            arch: amd64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opfor-${{ github.ref_name }}
          path: dist
      - name: Smoke Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          file_version="${GITHUB_REF_NAME#v}"
          package="opfor_${file_version}_${{ matrix.platform }}_${{ matrix.arch }}"
          mkdir smoke
          tar -xzf "dist/${package}.tar.gz" -C smoke
          binary="smoke/${package}/opfor"
          test "$("${binary}" version)" = "opfor ${GITHUB_REF_NAME}"
          test "$("${binary}" eval '1 + 2')" = "3"
          "${binary}" check testdata/upstream/aggressor-script-examples/bot.cna
      - name: Smoke Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fileVersion = $env:GITHUB_REF_NAME.Substring(1)
          $package = "opfor_${fileVersion}_windows_${{ matrix.arch }}"
          Expand-Archive -LiteralPath "dist/$package.zip" -DestinationPath smoke
          $binary = "smoke/$package/opfor.exe"
          if ((& $binary version) -ne "opfor $env:GITHUB_REF_NAME") { throw "version smoke test failed" }
          if ((& $binary eval "1 + 2") -ne "3") { throw "eval smoke test failed" }
          & $binary check testdata/upstream/aggressor-script-examples/bot.cna
          if ($LASTEXITCODE -ne 0) { throw "check smoke test failed" }

  release-publish:
    name: Publish alpha release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-alpha.')
    needs: release-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opfor-${{ github.ref_name }}
          path: dist
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            test "$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq .isPrerelease)" = "true"
            release_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
            test "${release_draft}" = "true" || test "${release_draft}" = "false"
            mkdir published
            gh release download "${GITHUB_REF_NAME}" --dir published
            find dist -maxdepth 1 -type f -exec basename {} \; | sort > expected-assets.txt
            find published -maxdepth 1 -type f -exec basename {} \; | sort > published-assets.txt
            diff -u expected-assets.txt published-assets.txt
            for artifact in dist/*; do
              cmp "${artifact}" "published/$(basename "${artifact}")"
            done
            if test "${release_draft}" = "true"; then
              gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
            fi
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes --prerelease
          fi
